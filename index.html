<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Assistant</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <div class="brand">

                <div class="brandIcon">
                    <i class="fa-solid fa-robot"></i>
                </div>

                <div>
                    <h2>AI Assistant</h2>
                    <span>Powered by Gemini ⚡
                        <br>
                        Made by Gurvesh.
                    </span>
                </div>

            </div>


           
            <button class="newChat">
                <i class="fa-solid fa-plus"></i>
                New Chat
            </button>


            <div class="sideTitle">
                Features
            </div>


            <div class="chatHistory">

                <div class="historyItem">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Fast AI Response</span>
                </div>

                <div class="historyItem">
                    <i class="fa-solid fa-code"></i>
                    <span>Programming Help</span>
                </div>

                <div class="historyItem">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>Smart Answers</span>
                </div>

            </div>


            <div class="sidebarBottom">

                <div class="sideOption">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </div>

                <div class="sideOption">
                    <i class="fa-regular fa-circle-question"></i>
                    <span>Help & Support</span>
                </div>

            </div>

        </aside>



        
        <div class="main">

          
            <header class="chatHeader">

                <div class="assistantInfo">

                    <div class="assistantIcon">
                        <i class="fa-solid fa-robot"></i>
                    </div>

                    <div>

                        <h1>AI Assistant</h1>

                        <div class="status">
                            <span class="statusDot"></span>
                            Online
                        </div>

                    </div>

                </div>


                <div class="headerActions">

                 
                    <button class="headerBtn themeBtn">
                        <i class="fa-solid fa-moon"></i>
                    </button>

                </div>

            </header>



            
            <div class="chatSec">

               

            </div>



           
            <div class="writingSection">

                <button class="attachBtn">
                    <i class="fa-solid fa-paperclip"></i>
                </button>

                <input
                    id="input"
                    type="text"
                    placeholder="Ask anything..."
                    autocomplete="off"
                >

                <button class="emojiBtn">
                    <i class="fa-regular fa-face-smile"></i>
                </button>

                <button class="sendBtn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

            </div>


            <p class="inputHint">
                AI can make mistakes. Check important information.
            </p>

        </div>



   
        <aside class="rightPanel">


           
            <div class="infoCard">

                <div class="cardTitle">

                    <i class="fa-regular fa-lightbulb"></i>

                    <h3>Try asking</h3>

                </div>


                <button class="promptBtn">
                    Explain JavaScript simply
                </button>

                <button class="promptBtn">
                    Help me with React
                </button>

                <button class="promptBtn">
                    Write a Java program
                </button>

                <button class="promptBtn">
                    Explain API in simple words
                </button>

            </div>



         
            <div class="tipCard">

                <div class="tipIcon">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>

                <div>

                    <h3>Quick Tip</h3>

                    <p>
                        Be specific with your questions
                        to get better answers.
                    </p>

                </div>

            </div>

        </aside>

    </div>

     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
